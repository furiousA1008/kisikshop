<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід в адмін панель | KISIK MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #14141c 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 rounded-3xl max-w-md w-full p-8 shadow-2xl">
        <div class="text-center mb-8">
            <div class="text-6xl mb-3">🐱</div>
            <h1 class="text-3xl font-black uppercase tracking-tighter">
                <span class="text-orange-500">KISIK</span> ADMIN
            </h1>
            <p class="text-gray-400 text-sm mt-2">Вхід в панель управління</p>
        </div>
        
        <form id="login-form" onsubmit="submitLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-bold mb-2">Логін</label>
                <input type="text" id="username" required 
                       class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 text-white outline-none focus:border-orange-500">
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Пароль</label>
                <input type="password" id="password" required 
                       class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 text-white outline-none focus:border-orange-500">
            </div>
            <button type="submit" 
                    class="w-full bg-orange-500 py-3 rounded-xl font-bold hover:bg-orange-600 transition">
                Увійти
            </button>
        </form>
        
        <p class="text-center text-gray-400 text-xs mt-4">
            <i class="fas fa-shield-alt"></i> Тільки для адміністраторів
        </p>
    </div>
    
    <script>
        async function submitLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.status === 'ok' && data.user.is_admin) {
                    window.location.href = '/admin';
                } else {
                    alert('Невірний логін або пароль, або недостатньо прав');
                }
            } catch(e) {
                alert('Помилка: ' + e.message);
            }
        }
    </script>
</body>
</html>
