<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KISIK MARKET | Товар</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: white; font-family: system-ui, -apple-system, sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #ff6b35, #ffb347); -webkit-background-clip: text; background-clip: text; color: transparent; }
        
        .gallery-container { position: relative; }
        .main-image { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 20px; cursor: zoom-in; transition: transform 0.2s; }
        .thumbnail { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; cursor: pointer; opacity: 0.6; transition: all 0.2s; border: 2px solid transparent; }
        .thumbnail:hover { opacity: 0.8; }
        .thumbnail.active { opacity: 1; border-color: #ff6b35; }
        
       /* Замініть на простий контейнер: */
        .gallery-container { position: relative; }
        .main-image { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 20px; cursor: pointer; }
        
        .tab-btn { padding: 12px 24px; background: rgba(255,255,255,0.05); border: none; color: #9ca3af; cursor: pointer; transition: all 0.2s; font-weight: 600; border-radius: 12px; }
        .tab-btn.active { background: #ff6b35; color: white; }
        .tab-content { display: none; padding: 24px; background: rgba(255,255,255,0.03); border-radius: 20px; margin-top: 20px; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .color-option { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
        .color-option:hover { transform: scale(1.1); }
        .color-option.selected { border-color: white; box-shadow: 0 0 0 2px #ff6b35; transform: scale(1.05); }
        
        .size-option { padding: 10px 20px; background: rgba(255,255,255,0.05); border-radius: 12px; cursor: pointer; transition: all 0.2s; text-align: center; font-weight: 600; }
        .size-option:hover { background: rgba(255,107,53,0.3); }
        .size-option.selected { background: #ff6b35; color: white; }
        
        .size-chart-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 1100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); cursor: pointer; }
        .size-chart-modal img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 16px; }
        
        .cart-badge { position: absolute; top: -5px; right: -5px; background: #ff6b35; color: white; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ff6b35; padding: 12px 24px; border-radius: 40px; z-index: 1100; animation: fadeInUp 0.3s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .loading-spinner { border: 3px solid rgba(255,107,53,0.3); border-top: 3px solid #ff6b35; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .star-rating { display: flex; gap: 5px; cursor: pointer; }
        .star { font-size: 24px; color: #4a5568; transition: color 0.2s; }
        .star.active { color: #ffb347; }
        .star:hover { color: #ffb347; }
        
        .review-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        
        .favorite-btn { transition: all 0.2s; }
        .favorite-btn.active { color: #ef4444; }
        .favorite-btn:not(.active):hover { color: #ef4444; transform: scale(1.1); }
        
        @media (max-width: 768px) {
            .thumbnail { width: 60px; height: 60px; }
            .tab-btn { padding: 8px 16px; font-size: 14px; }
        }
        /* Покращені стилі для вибору кольору */
        .color-option {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid rgba(255,255,255,0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .color-option:hover {
            transform: scale(1.1);
            border-color: white;
        }

        .color-option.selected {
            border: 2px solid white;
            box-shadow: 0 0 0 2px #ff6b35;
            transform: scale(1.05);
        }

        /* Спеціальний стиль для чорного кольору */
        .color-option[style*="background: rgb(0, 0, 0)"],
        .color-option[style*="background: #000000"],
        .color-option[style*="background: #000"] {
            box-shadow: 0 0 0 1px rgba(255,255,255,0.5);
        }

        /* Кастомний скролбар для мініатюр - ЕСТЕТИЧНО */
        .thumbnail-container::-webkit-scrollbar {
            height: 4px;
        }
        
        .thumbnail-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .thumbnail-container::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #ff6b35, #ffb347);
            border-radius: 10px;
        }
        
        .thumbnail-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(90deg, #ff8c42, #ffc857);
        }
        
        /* Для Firefox */
        .thumbnail-container {
            scrollbar-width: thin;
            scrollbar-color: #ff6b35 rgba(255, 255, 255, 0.05);
        }
        
        .color-option[style*="background: rgb(0, 0, 0)"]:hover,
        .color-option[style*="background: #000000"]:hover,
        .color-option[style*="background: #000"]:hover {
            box-shadow: 0 0 0 2px white;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,107,53,0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255,107,53,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,107,53,0); }
        }
        .fixed.bottom-6.right-6 {
            animation: pulse-ring 2s infinite;
        }
        @media (max-width: 640px) {
            .fixed.bottom-6.right-6 {
                bottom: 16px;
                right: 16px;
                padding: 12px;
            }
            .fixed.bottom-6.right-6 i {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <header class="sticky top-0 z-50 bg-black/60 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <a href="/" class="flex items-center gap-3 cursor-pointer">
                    <div class="text-4xl">🐱</div>
                    <div>
                        <h1 class="text-2xl font-black"><span class="gradient-text">KISIK</span> MARKET</h1>
                        <p class="text-[10px] font-bold text-orange-400">✨ Працюємо без передплати ✨</p>
                    </div>
                </a>
                
                <div class="flex items-center gap-3">
                    <button onclick="toggleCart()" class="relative bg-white/10 p-2 rounded-full hover:bg-white/20 transition">
                        <i class="fas fa-shopping-cart text-lg"></i>
                        <span id="cartCount" class="cart-badge hidden">0</span>
                    </button>
                    
                    <a href="/admin" id="adminPanelBtn" class="hidden bg-purple-600/20 hover:bg-purple-600/30 px-3 py-2 rounded-full transition">
                        <i class="fas fa-crown"></i> <span class="hidden sm:inline">Admin</span>
                    </a>
                    
                    <div id="authButtons" class="flex gap-2">
                        <button onclick="openAuth('login')" class="px-4 py-2 rounded-full bg-white/10 text-sm hover:bg-white/20 transition">Вхід</button>
                        <button onclick="openAuth('register')" class="px-4 py-2 rounded-full bg-orange-500 text-sm hover:bg-orange-600 transition">Реєстрація</button>
                    </div>
                    
                    <div id="userMenu" class="hidden relative">
                        <button onclick="toggleUserMenu()" class="flex items-center gap-2 bg-white/10 px-3 py-2 rounded-full">
                            <i class="fas fa-user"></i>
                            <span id="userName"></span>
                            <i class="fas fa-chevron-down text-xs"></i>
                        </button>
                        <div id="userDropdown" class="hidden absolute right-0 mt-2 bg-slate-800 rounded-xl shadow-xl w-48 z-50">
                            <button onclick="showFavorites()" class="w-full text-left px-4 py-2 text-sm hover:bg-white/10">❤️ Обране</button>
                            <hr class="border-white/10">
                            <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-white/10">🚪 Вийти</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="productContent">
            <div class="loading-spinner"></div>
        </div>
    </main>

    <!-- Модалка кошика -->
    <div id="cartModal" class="fixed hidden inset-0 bg-black/95 z-[1000] flex items-center justify-center backdrop-blur-md">
        <div class="bg-slate-900 rounded-3xl max-w-2xl w-full max-h-[80vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black"><i class="fas fa-shopping-cart text-orange-500"></i> Кошик</h2>
                <button onclick="toggleCart()" class="text-gray-400 text-2xl hover:text-white">&times;</button>
            </div>
            <div id="cartItems"></div>
            <div id="cartEmpty" class="text-center py-10 text-gray-400 hidden">🛒 Кошик порожній</div>
            <div id="cartSummary" class="border-t border-white/10 pt-4 hidden">
                <div class="flex justify-between text-xl font-bold mb-4">
                    <span>До сплати:</span>
                    <span id="cartTotal" class="text-orange-500">0 грн</span>
                </div>
                <button onclick="openCheckout()" class="w-full bg-orange-500 py-3 rounded-xl font-bold hover:bg-orange-600 transition">Оформити замовлення</button>
            </div>
        </div>
    </div>

    <!-- Модалка оформлення замовлення -->
    <div id="checkoutModal" class="fixed hidden inset-0 bg-black/95 z-[1000] flex items-center justify-center backdrop-blur-md">
        <div class="bg-slate-900 rounded-3xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black">Оформлення замовлення</h2>
                <button onclick="closeCheckout()" class="text-gray-400 text-2xl hover:text-white">&times;</button>
            </div>
            <form id="checkoutForm">
                <input type="text" id="checkoutName" placeholder="ПІБ *" required class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 mb-3 text-white">
                <input type="tel" id="checkoutPhone" placeholder="Номер телефону *" required class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 mb-3 text-white">
                <input type="email" id="checkoutEmail" placeholder="Email (необов'язково)" class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 mb-3 text-white">
                <input type="text" id="checkoutCity" placeholder="Місто *" required class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 mb-3 text-white">
                
                <div class="mb-4">
                    <label class="block text-sm font-bold mb-2">Спосіб оплати *</label>
                    <div class="space-y-2">
                        <label class="flex items-center gap-3 p-3 bg-slate-800 rounded-xl cursor-pointer hover:bg-slate-700">
                            <input type="radio" name="paymentMethod" value="full" checked class="w-4 h-4 text-orange-500">
                            <span><i class="fas fa-credit-card text-green-400"></i> Повна оплата (онлайн)</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-slate-800 rounded-xl cursor-pointer hover:bg-slate-700">
                            <input type="radio" name="paymentMethod" value="partial" class="w-4 h-4 text-orange-500">
                            <span><i class="fas fa-percent text-yellow-400"></i> Часткова оплата (30% передплата)</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-slate-800 rounded-xl cursor-pointer hover:bg-slate-700">
                            <input type="radio" name="paymentMethod" value="post" class="w-4 h-4 text-orange-500">
                            <span><i class="fas fa-truck text-blue-400"></i> Оплата на пошті</span>
                        </label>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-bold mb-2">Адреса відділення Нової Пошти *</label>
                    <textarea id="checkoutAddress" rows="3" placeholder="Наприклад: м. Київ, вул. Хрещатик, 22, Нова Пошта №5" required class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 text-white resize-none"></textarea>
                    <p class="text-xs text-gray-400 mt-1">Вкажіть місто, вулицю, номер відділення або поштомату</p>
                </div>
                
                <button type="submit" class="w-full bg-orange-500 py-3 rounded-xl font-bold hover:bg-orange-600 transition">✅ Підтвердити замовлення</button>
            </form>
        </div>
    </div>

    <!-- Модалка обраного -->
    <div id="favoritesModal" class="fixed hidden inset-0 bg-black/95 z-[1000] flex items-center justify-center backdrop-blur-md">
        <div class="bg-slate-900 rounded-3xl max-w-2xl w-full max-h-[80vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black"><i class="fas fa-heart text-red-500"></i> Обрані товари</h2>
                <button onclick="closeFavorites()" class="text-gray-400 text-2xl hover:text-white">&times;</button>
            </div>
            <div id="favoritesList"></div>
        </div>
    </div>

    <!-- Модалка авторизації -->
    <div id="authModal" class="fixed hidden inset-0 bg-black/95 z-[1000] flex items-center justify-center backdrop-blur-md">
        <div class="bg-slate-900 rounded-3xl max-w-md w-full p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 id="authTitle" class="text-2xl font-black">Вхід</h3>
                <button onclick="closeAuth()" class="text-gray-400 text-2xl hover:text-white">&times;</button>
            </div>
            <form id="authForm">
                <input type="hidden" id="authMode" value="login">
                <input type="text" id="authUsername" placeholder="Логін" required class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 mb-4 text-white focus:border-orange-500">
                <input type="password" id="authPassword" placeholder="Пароль" required class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 mb-4 text-white focus:border-orange-500">
                <button type="submit" class="w-full bg-orange-500 py-3 rounded-xl font-bold hover:bg-orange-600 transition">Увійти</button>
                <p class="text-center text-sm text-gray-400 mt-4">
                    <span id="authSwitchText">Немає акаунту?</span>
                    <button type="button" onclick="switchAuthMode()" class="text-orange-500 ml-1">Зареєструватись</button>
                </p>
            </form>
        </div>
    </div>
        <!-- Кнопка зв'язку з менеджером (Telegram) -->
    <a href="https://t.me/ArtSeXm" 
       target="_blank" 
       class="fixed bottom-6 right-6 z-50 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white rounded-full p-4 shadow-2xl transition-all duration-300 hover:scale-110 group flex items-center justify-center"
       style="box-shadow: 0 4px 15px rgba(255,107,53,0.4);">
        <div class="relative">
            <i class="fab fa-telegram-plane text-2xl group-hover:rotate-12 transition-transform duration-300"></i>
            <span class="absolute -top-1 -right-1 w-3 h-3 bg-green-400 rounded-full animate-pulse"></span>
        </div>
        <span class="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-xs group-hover:ml-2 transition-all duration-300 text-sm font-medium">Написати менеджеру</span>
    </a>


    <script>
        let product = null;
        let currentUser = null;
        let cartItems = [];
        let selectedSize = null;
        let selectedColor = null;
        let quantity = 1;
        let colorsList = [];
        let reviews = [];
        let isFavorite = false;
        let userRating = 0;

        const productId = {{ product_id }};

        async function api(url, options = {}) {
            try {
                const res = await fetch(url, {
                    ...options,
                    headers: { 'Content-Type': 'application/json', ...options.headers }
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Помилка');
                }
                return res.json();
            } catch(e) {
                console.error('API Error:', e);
                throw e;
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            if (isError) toast.style.background = '#ef4444';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function loadUser() {
            try {
                const data = await api('/api/me');
                if (data.user) {
                    currentUser = data.user;
                    document.getElementById('authButtons').classList.add('hidden');
                    document.getElementById('userMenu').classList.remove('hidden');
                    document.getElementById('userName').textContent = currentUser.username;
                    
                    if (currentUser.is_admin) {
                        const adminBtn = document.getElementById('adminPanelBtn');
                        if (adminBtn) adminBtn.classList.remove('hidden');
                    }
                    
                    await checkFavoriteStatus();
                } else {
                    currentUser = null;
                    document.getElementById('authButtons').classList.remove('hidden');
                    document.getElementById('userMenu').classList.add('hidden');
                    const adminBtn = document.getElementById('adminPanelBtn');
                    if (adminBtn) adminBtn.classList.add('hidden');
                }
            } catch(e) { 
                console.error('loadUser error:', e);
            }
        }

        async function checkFavoriteStatus() {
            if (!currentUser) return;
            try {
                const favorites = await api('/api/favorites');
                isFavorite = favorites.includes(productId);
                updateFavoriteButton();
            } catch(e) { console.error(e); }
        }

        function updateFavoriteButton() {
            const favBtn = document.getElementById('favoriteBtn');
            if (favBtn) {
                if (isFavorite) {
                    favBtn.classList.add('active');
                    favBtn.innerHTML = '<i class="fas fa-heart text-2xl"></i>';
                } else {
                    favBtn.classList.remove('active');
                    favBtn.innerHTML = '<i class="far fa-heart text-2xl"></i>';
                }
            }
        }

        async function toggleFavorite() {
            if (!currentUser) {
                showToast('Увійдіть в акаунт, щоб додати в обране', true);
                openAuth('login');
                return;
            }
            
            try {
                if (isFavorite) {
                    await api(`/api/favorites/${productId}`, { method: 'DELETE' });
                    isFavorite = false;
                    showToast('❤️ Видалено з обраного');
                } else {
                    await api(`/api/favorites/${productId}`, { method: 'POST' });
                    isFavorite = true;
                    showToast('💖 Додано в обране');
                }
                updateFavoriteButton();
            } catch(e) {
                showToast('❌ ' + e.message, true);
            }
        }

        async function loadColors() {
            try {
                colorsList = await api('/api/colors');
            } catch(e) { console.error(e); }
        }

        function getColorInfo(colorName) {
            const color = colorsList.find(c => c.name === colorName);
            return color || { name: colorName, code: '#808080', icon: '🎨' };
        }

        async function loadProduct() {
            try {
                product = await api(`/api/products/${productId}`);
                await loadColors();
                await loadReviews();
                renderProduct();
            } catch(e) {
                document.getElementById('productContent').innerHTML = `
                    <div class="text-center py-20">
                        <i class="fas fa-exclamation-triangle text-6xl text-red-500 mb-4"></i>
                        <p class="text-xl">Товар не знайдено</p>
                        <a href="/" class="inline-block mt-6 px-6 py-3 bg-orange-500 rounded-xl hover:bg-orange-600">На головну</a>
                    </div>
                `;
            }
        }

        async function loadReviews() {
            try {
                reviews = await api(`/api/products/${productId}/reviews`);
            } catch(e) { console.error(e); }
        }

        async function submitReview() {
            if (!currentUser) {
                showToast('Увійдіть в акаунт, щоб залишити відгук', true);
                openAuth('login');
                return;
            }
            
            if (userRating === 0) {
                showToast('Оберіть оцінку', true);
                return;
            }
            
            const comment = document.getElementById('reviewComment').value;
            
            try {
                await api(`/api/products/${productId}/reviews`, {
                    method: 'POST',
                    body: JSON.stringify({ rating: userRating, comment })
                });
                showToast('✅ Відгук додано');
                document.getElementById('reviewComment').value = '';
                userRating = 0;
                renderStarRating();
                await loadReviews();
                await loadProduct();
            } catch(e) {
                showToast('❌ ' + e.message, true);
            }
        }

        function renderStarRating() {
            const container = document.getElementById('starRating');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('i');
                star.className = `fas fa-star star ${i <= userRating ? 'active' : ''}`;
                star.style.cursor = 'pointer';
                star.onclick = () => {
                    userRating = i;
                    renderStarRating();
                };
                container.appendChild(star);
            }
        }

        function openSizeChartModal() {
            if (product.size_chart_url) {
                const modal = document.createElement('div');
                modal.className = 'size-chart-modal';
                modal.onclick = () => modal.remove();
                modal.innerHTML = `<img src="${product.size_chart_url}" alt="Розмірна сітка" onclick="event.stopPropagation()">`;
                document.body.appendChild(modal);
            }
        }

        function renderProduct() {
            const container = document.getElementById('productContent');
            const photos = product.photos || [];
            const mainPhoto = photos[0] || 'https://placehold.co/800x800?text=KISIK';
            const productColors = product.colors || [];
            const hasSizeChart = product.size_chart_url && product.size_chart_url.trim() !== '';
            const ratingDisplay = product.rating_avg > 0 ? product.rating_avg.toFixed(1) : '0';
            
            container.innerHTML = `
                <div class="grid md:grid-cols-2 gap-8 mb-12">
                    <div>
                        <<div class="gallery-container mb-4">
                            <img src="${mainPhoto}" alt="${product.name}" class="main-image" id="mainImage">
                        </div>
                        ${photos.length > 1 ? `
                            <div class="flex gap-3 overflow-x-auto pb-2">
                                ${photos.map((photo, idx) => `
                                    <img src="${photo}" class="thumbnail ${idx === 0 ? 'active' : ''}" onclick="changeImage(${idx})">
                                `).join('')}
                            </div>
                        ` : ''}
                        ${hasSizeChart ? `
                            <div class="mt-4 text-center">
                                <button onclick="openSizeChartModal()" class="text-sm bg-white/10 px-4 py-2 rounded-full hover:bg-white/20 transition">
                                    <i class="fas fa-ruler-combined text-orange-400"></i> Дивитись розмірну сітку
                                </button>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div>
                        <div class="mb-4">
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-sm text-orange-400">${product.category}</span>
                                    ${product.brand ? `<span class="text-sm text-gray-500">| ${product.brand}</span>` : ''}
                                </div>
                                <button id="favoriteBtn" onclick="toggleFavorite()" class="favorite-btn px-3 py-2 rounded-full hover:bg-white/10 transition">
                                    <i class="${isFavorite ? 'fas' : 'far'} fa-heart text-2xl"></i>
                                </button>
                            </div>
                            <h1 class="text-3xl md:text-4xl font-black mb-3">${escapeHtml(product.name)}</h1>
                            <div class="flex items-center gap-2 mb-4">
                                <div class="flex text-yellow-400">
                                    ${renderStars(product.rating_avg)}
                                </div>
                                <span class="text-sm text-gray-400">${ratingDisplay} (${product.rating_count} відгуків)</span>
                            </div>
                            <p class="text-4xl font-bold text-orange-500 mb-4">${product.price} ₴</p>
                            <p class="text-gray-400 mb-6">${product.description || 'Стильний та якісний товар від KISIK MARKET. Ідеально підходить для повсякденного носіння.'}</p>
                        </div>
                        
                        
                        ${productColors.length > 0 ? `
                            <div class="mb-6">
                                <p class="font-bold mb-3">Колір: <span id="selectedColorText" class="text-orange-400 font-semibold">${productColors[0]}</span></p>
                                <div class="flex gap-3 flex-wrap" id="colorOptions">
                                    ${productColors.map(color => {
                                        const colorInfo = getColorInfo(color);
                                        // Додаємо обводку для чорного кольору
                                        const isBlack = color === 'Чорний' || color.toLowerCase() === 'black';
                                        const borderStyle = isBlack ? 'border: 2px solid white; box-shadow: 0 0 0 1px rgba(255,255,255,0.3);' : '';
                                        return `
                                            <div class="color-option ${color === productColors[0] ? 'selected' : ''}" 
                                                 style="background: ${colorInfo.code}; ${borderStyle} width: 44px; height: 44px; border-radius: 50%; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; ${color === productColors[0] ? 'border: 2px solid white; box-shadow: 0 0 0 2px #ff6b35;' : 'border: 2px solid rgba(255,255,255,0.2);'}"
                                                 title="${color}"
                                                 onclick="selectColor('${color}')">
                                                ${isBlack ? '<i class="fas fa-tshirt" style="color: white; font-size: 18px; text-shadow: 0 0 2px black;"></i>' : ''}
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        ` : ''}
                        
                        <div class="mb-6">
                            <p class="font-bold mb-3">Розмір: <span id="selectedSizeText">Оберіть розмір</span></p>
                            <div class="flex gap-3 flex-wrap" id="sizeOptions">
                                ${product.sizes.map(size => `
                                    <div class="size-option" onclick="selectSize('${size}')">${size}</div>
                                `).join('')}
                            </div>
                        </div>
                        
                        <!-- Секція вибору кольору - ОНОВЛЕНА з кращою видимістю -->
                        <div class="mb-6">
                            <p class="font-bold mb-3">Колір: <span id="selectedColorText" class="text-orange-400"></span></p>
                            <div class="flex gap-3 flex-wrap" id="colorOptions">
                                <!-- Color options will be rendered here -->
                            </div>
                        </div>
                        
                        <div class="flex gap-4">
                            <button onclick="addToCart()" class="flex-1 bg-orange-500 py-4 rounded-xl font-bold hover:bg-orange-600 transition text-lg">
                                <i class="fas fa-shopping-cart"></i> Додати в кошик
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="mt-12">
                    <div class="flex gap-3 flex-wrap border-b border-white/10 pb-3">
                        <button class="tab-btn active" onclick="switchTab('description')">📝 Опис</button>
                        <button class="tab-btn" onclick="switchTab('specs')">⚙️ Характеристики</button>
                        <button class="tab-btn" onclick="switchTab('reviews')">💬 Відгуки (${product.rating_count})</button>
                        <button class="tab-btn" onclick="switchTab('delivery')">🚚 Доставка та оплата</button>
                    </div>
                    
                    <div id="tab-description" class="tab-content active">
                        <p class="text-gray-300 leading-relaxed">${product.description || 'Стильний та якісний товар від KISIK MARKET. Ідеально підходить для повсякденного носіння. Виготовлено з високоякісних матеріалів, що забезпечують комфорт та довговічність.'}</p>
                    </div>
                    
                    <div id="tab-specs" class="tab-content">
                        <div class="space-y-3">
                            <div class="flex py-2 border-b border-white/10"><span class="w-32 text-gray-400">Бренд:</span><span class="font-medium">${product.brand || 'KISIK'}</span></div>
                            <div class="flex py-2 border-b border-white/10"><span class="w-32 text-gray-400">Категорія:</span><span class="font-medium">${product.category}</span></div>
                            <div class="flex py-2 border-b border-white/10"><span class="w-32 text-gray-400">Матеріал:</span><span class="font-medium">${product.material || '100% бавовна'}</span></div>
                            <div class="flex py-2 border-b border-white/10"><span class="w-32 text-gray-400">Країна:</span><span class="font-medium">${product.country || 'Україна'}</span></div>
                            <div class="flex py-2 border-b border-white/10"><span class="w-32 text-gray-400">Доступні розміри:</span><span class="font-medium">${product.sizes.join(', ')}</span></div>
                            ${product.colors && product.colors.length ? `<div class="flex py-2 border-b border-white/10"><span class="w-32 text-gray-400">Кольори:</span><span class="font-medium">${product.colors.join(', ')}</span></div>` : ''}
                        </div>
                    </div>
                    
                    <div id="tab-reviews" class="tab-content">
                        <div class="mb-6">
                            <h3 class="text-xl font-bold mb-4">Залишити відгук</h3>
                            <div class="mb-3">
                                <p class="text-sm mb-2">Ваша оцінка:</p>
                                <div id="starRating" class="star-rating"></div>
                            </div>
                            <textarea id="reviewComment" rows="3" placeholder="Ваш коментар..." class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 text-white resize-none mb-3"></textarea>
                            <button onclick="submitReview()" class="bg-orange-500 px-6 py-2 rounded-xl font-bold hover:bg-orange-600 transition">Додати відгук</button>
                        </div>
                        <div class="border-t border-white/10 pt-4">
                            <h3 class="text-xl font-bold mb-4">Відгуки покупців</h3>
                            <div id="reviewsList">
                                ${reviews.length === 0 ? '<p class="text-gray-400 text-center py-8">Ще немає відгуків. Будьте першим!</p>' : 
                                    reviews.map(r => `
                                        <div class="review-card">
                                            <div class="flex items-center justify-between mb-2">
                                                <span class="font-bold">${escapeHtml(r.user_name)}</span>
                                                <div class="flex text-yellow-400">${renderStars(r.rating)}</div>
                                            </div>
                                            <p class="text-gray-300 text-sm">${escapeHtml(r.comment || '')}</p>
                                            <p class="text-gray-500 text-xs mt-2">${new Date(r.created_at).toLocaleDateString()}</p>
                                        </div>
                                    `).join('')
                                }
                            </div>
                        </div>
                    </div>
                    
                    <div id="tab-delivery" class="tab-content">
                        <div class="space-y-4">
                            <div class="flex gap-4 p-4 bg-white/5 rounded-xl">
                                <i class="fas fa-truck text-3xl text-orange-400"></i>
                                <div>
                                    <h4 class="font-bold mb-2">Доставка Новою Поштою</h4>
                                    <p class="text-gray-400 text-sm">Доставка по всій Україні. Вартість згідно з тарифами перевізника.</p>
                                </div>
                            </div>
                            <div class="flex gap-4 p-4 bg-white/5 rounded-xl">
                                <i class="fas fa-credit-card text-3xl text-orange-400"></i>
                                <div>
                                    <h4 class="font-bold mb-2">Способи оплати</h4>
                                    <p class="text-gray-400 text-sm">• Повна оплата онлайн<br>• Часткова оплата (30% передплата)<br>• Оплата при отриманні на пошті</p>
                                </div>
                            </div>
                            <div class="flex gap-4 p-4 bg-white/5 rounded-xl">
                                <i class="fas fa-undo-alt text-3xl text-orange-400"></i>
                                <div>
                                    <h4 class="font-bold mb-2">Повернення та обмін</h4>
                                    <p class="text-gray-400 text-sm">Протягом 14 днів з моменту отримання. Товар має бути не використаний.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    ${hasSizeChart ? `
                        <div id="tab-size-chart" class="tab-content">
                            <div class="text-center">
                                <img src="${product.size_chart_url}" alt="Розмірна сітка" class="max-w-full rounded-xl cursor-pointer" onclick="openSizeChartModal()">
                                <p class="text-sm text-gray-400 mt-3">Натисніть на зображення для збільшення</p>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            
            if (productColors.length > 0) {
                selectedColor = productColors[0];
                document.getElementById('selectedColorText').textContent = selectedColor;
            }
            
            renderStarRating();
            updateFavoriteButton();
        }

        function renderStars(rating) {
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.5;
            let stars = '';
            for (let i = 0; i < fullStars; i++) stars += '<i class="fas fa-star"></i>';
            if (hasHalf) stars += '<i class="fas fa-star-half-alt"></i>';
            for (let i = stars.length; i < 5; i++) stars += '<i class="far fa-star"></i>';
            return stars;
        }

        function changeImage(index) {
            const photos = product.photos;
            const mainImage = document.getElementById('mainImage');
            if (mainImage && photos[index]) {
                mainImage.src = photos[index];
                document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
                    if (i === index) thumb.classList.add('active');
                    else thumb.classList.remove('active');
                });
            }
        }

        function selectSize(size) {
            selectedSize = size;
            document.getElementById('selectedSizeText').textContent = size;
            document.querySelectorAll('.size-option').forEach(el => {
                if (el.textContent === size) el.classList.add('selected');
                else el.classList.remove('selected');
            });
        }

        function selectColor(color) {
            selectedColor = color;
            document.getElementById('selectedColorText').textContent = color;
            document.querySelectorAll('.color-option').forEach(el => {
                if (el.title === color) el.classList.add('selected');
                else el.classList.remove('selected');
            });
        }

        function changeQuantity(delta) {
            quantity = Math.max(1, Math.min(99, quantity + delta));
            document.getElementById('quantity').textContent = quantity;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            const btns = document.querySelectorAll('.tab-btn');
            const contents = ['description', 'specs', 'reviews', 'delivery', 'size-chart'];
            const index = contents.indexOf(tab);
            if (index >= 0 && btns[index]) btns[index].classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        async function addToCart() {
            if (!selectedSize) {
                showToast('❌ Будь ласка, оберіть розмір', true);
                return;
            }
            
            try {
                await api('/api/cart', {
                    method: 'POST',
                    body: JSON.stringify({
                        product_id: product.id,
                        size: selectedSize,
                        color: selectedColor,
                        quantity: quantity
                    })
                });
                await loadCart();
                showToast('✅ Товар додано в кошик');
            } catch(e) {
                showToast('❌ ' + e.message, true);
            }
        }

        async function loadCart() {
            try {
                cartItems = await api('/api/cart');
                updateCartUI();
            } catch(e) { console.error(e); }
        }

        function updateCartUI() {
            const count = cartItems.reduce((s, i) => s + i.quantity, 0);
            const badge = document.getElementById('cartCount');
            if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); }
            else { badge.classList.add('hidden'); }
        }

        function toggleCart() {
            renderCart();
            document.getElementById('cartModal').classList.toggle('hidden');
        }

        async function renderCart() {
            const container = document.getElementById('cartItems');
            const empty = document.getElementById('cartEmpty');
            const summary = document.getElementById('cartSummary');
            if (!cartItems.length) {
                container.innerHTML = ''; empty.classList.remove('hidden'); summary.classList.add('hidden');
                return;
            }
            empty.classList.add('hidden'); summary.classList.remove('hidden');
            let total = 0;
            container.innerHTML = cartItems.map(item => {
                total += item.price * item.quantity;
                return `
                    <div class="flex gap-4 p-4 bg-white/5 rounded-2xl mb-3">
                        <img src="${item.photo || 'https://placehold.co/80'}" class="w-20 h-20 rounded-xl object-cover">
                        <div class="flex-1">
                            <h4 class="font-bold">${escapeHtml(item.name)}</h4>
                            <p class="text-sm">Розмір: ${item.size}</p>
                            ${item.color ? `<p class="text-sm">Колір: ${item.color}</p>` : ''}
                            <p class="text-orange-400">${item.price} грн</p>
                            <div class="flex items-center gap-2 mt-2">
                                <button onclick="updateQty(${item.id}, ${item.quantity - 1})" class="w-8 h-8 bg-white/10 rounded-full">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQty(${item.id}, ${item.quantity + 1})" class="w-8 h-8 bg-white/10 rounded-full">+</button>
                                <button onclick="removeItem(${item.id})" class="ml-auto text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            document.getElementById('cartTotal').textContent = total + ' грн';
        }

        async function updateQty(id, qty) {
            if (qty <= 0) { await removeItem(id); return; }
            await api('/api/cart/update', { method: 'POST', body: JSON.stringify({ cart_item_id: id, quantity: qty }) });
            await loadCart();
            renderCart();
        }

        async function removeItem(id) {
            await api(`/api/cart/${id}`, { method: 'DELETE' });
            await loadCart();
            renderCart();
        }

        function openCheckout() {
            if (!cartItems.length) {
                showToast('Кошик порожній', true);
                return;
            }
            toggleCart();
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckout() { document.getElementById('checkoutModal').classList.add('hidden'); }

        document.getElementById('checkoutForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('checkoutName').value.trim();
            const phone = document.getElementById('checkoutPhone').value.trim();
            const email = document.getElementById('checkoutEmail').value.trim();
            const city = document.getElementById('checkoutCity').value.trim();
            const warehouse_address = document.getElementById('checkoutAddress').value.trim();
            const payment_method = document.querySelector('input[name="paymentMethod"]:checked').value;
            
            if (!name || !phone || !city || !warehouse_address) { 
                showToast('❌ Заповніть всі обов\'язкові поля', true); 
                return; 
            }
            
            const submitBtn = document.querySelector('#checkoutForm button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Відправка...';
            
            try {
                const data = await api('/api/checkout', { 
                    method: 'POST', 
                    body: JSON.stringify({ 
                        name, phone, email, city, warehouse_address, payment_method
                    }) 
                });
                
                showToast(`✅ Замовлення №${data.order_number} створено! Дякуємо!`);
                closeCheckout();
                await loadCart();
                renderCart();
                
                document.getElementById('checkoutName').value = '';
                document.getElementById('checkoutPhone').value = '';
                document.getElementById('checkoutEmail').value = '';
                document.getElementById('checkoutCity').value = '';
                document.getElementById('checkoutAddress').value = '';
                
            } catch(e) { 
                showToast('❌ ' + e.message, true); 
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Підтвердити замовлення';
            }
        };

        async function showFavorites() {
            if (!currentUser) {
                showToast('Увійдіть в акаунт', true);
                return;
            }
            try {
                const favoriteIds = await api('/api/favorites');
                if (!favoriteIds.length) {
                    document.getElementById('favoritesList').innerHTML = '<div class="text-center py-10 text-gray-400">❤️ У вас ще немає обраних товарів</div>';
                } else {
                    const productsData = await Promise.all(favoriteIds.map(id => api(`/api/products/${id}`)));
                    document.getElementById('favoritesList').innerHTML = productsData.map(p => `
                        <div class="flex gap-4 p-4 bg-white/5 rounded-2xl mb-3 cursor-pointer" onclick="location.href='/product/${p.id}'">
                            <img src="${p.photos[0] || 'https://placehold.co/80'}" class="w-20 h-20 rounded-xl object-cover">
                            <div class="flex-1">
                                <h4 class="font-bold">${escapeHtml(p.name)}</h4>
                                <p class="text-orange-400 font-bold">${p.price} грн</p>
                                <div class="flex text-yellow-400 text-sm mt-1">${renderStars(p.rating_avg)}</div>
                            </div>
                        </div>
                    `).join('');
                }
                document.getElementById('favoritesModal').classList.remove('hidden');
            } catch(e) { showToast('❌ ' + e.message, true); }
        }

        function closeFavorites() { document.getElementById('favoritesModal').classList.add('hidden'); }

        function openAuth(mode) {
            document.getElementById('authMode').value = mode;
            document.getElementById('authTitle').textContent = mode === 'login' ? 'Вхід' : 'Реєстрація';
            const switchText = document.getElementById('authSwitchText');
            const switchBtn = document.querySelector('#authForm .text-orange-500');
            if (mode === 'login') {
                switchText.textContent = 'Немає акаунту?';
                if (switchBtn) switchBtn.textContent = 'Зареєструватись';
            } else {
                switchText.textContent = 'Вже є акаунт?';
                if (switchBtn) switchBtn.textContent = 'Увійти';
            }
            document.getElementById('authModal').classList.remove('hidden');
        }

        function closeAuth() { document.getElementById('authModal').classList.add('hidden'); }

        function switchAuthMode() {
            const mode = document.getElementById('authMode').value;
            openAuth(mode === 'login' ? 'register' : 'login');
        }

        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const mode = document.getElementById('authMode').value;
            const username = document.getElementById('authUsername').value;
            const password = document.getElementById('authPassword').value;
            try {
                const endpoint = mode === 'login' ? '/api/login' : '/api/register';
                await api(endpoint, { method: 'POST', body: JSON.stringify({ username, password }) });
                showToast(mode === 'login' ? '✅ Вхід виконано' : '✅ Реєстрація успішна');
                closeAuth();
                await loadUser();
                await loadCart();
                await checkFavoriteStatus();
            } catch(e) { showToast('❌ ' + e.message, true); }
        };

        async function logout() {
            await api('/api/logout', { method: 'POST' });
            window.location.href = '/';
        }

        function toggleUserMenu() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('hidden');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
        }

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('userMenu');
            if (menu && !menu.contains(e.target) && !document.getElementById('userDropdown')?.contains(e.target)) {
                document.getElementById('userDropdown')?.classList.add('hidden');
            }
        });

        async function init() {
            await loadUser();
            await loadProduct();
            await loadCart();
        }
        
        init();
    </script>
</body>
</html>
