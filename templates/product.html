<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KISIK MARKET | Товар</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Select2 тільки для відділень -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: white; font-family: system-ui, -apple-system, sans-serif; }
        .gradient-text { background: linear-gradient(135deg, #ff6b35, #ffb347); -webkit-background-clip: text; background-clip: text; color: transparent; }
        
        .gallery-container { position: relative; background: #1a1a2e; border-radius: 24px; overflow: hidden; }
        .main-image { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; transition: transform 0.3s ease; cursor: zoom-in; }
        .main-image:hover { transform: scale(1.02); }
        
        .thumb-wrapper { position: relative; margin-top: 16px; padding: 0 40px; }
        .thumbnail-container { display: flex; gap: 12px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
        .thumbnail-container::-webkit-scrollbar { display: none; }
        .thumbnail { min-width: 80px; width: 80px; height: 80px; object-fit: cover; border-radius: 16px; cursor: pointer; opacity: 0.5; transition: all 0.2s; border: 2px solid transparent; }
        .thumbnail:hover { opacity: 0.8; transform: scale(1.05); }
        .thumbnail.active { opacity: 1; border-color: #ff6b35; box-shadow: 0 0 0 2px rgba(255,107,53,0.3); }
        
        .thumb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; color: white; cursor: pointer; z-index: 10; transition: all 0.2s; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .thumb-nav:hover { background: #ff6b35; border-color: transparent; transform: translateY(-50%) scale(1.1); }
        .thumb-nav.left { left: 0; }
        .thumb-nav.right { right: 0; }
        
        @media (max-width: 640px) {
            .thumb-wrapper { padding: 0 30px; }
            .thumbnail { min-width: 60px; width: 60px; height: 60px; border-radius: 12px; }
            .thumb-nav { width: 28px; height: 28px; font-size: 10px; }
        }
        
        .tab-btn { padding: 12px 24px; background: rgba(255,255,255,0.05); border: none; color: #9ca3af; cursor: pointer; transition: all 0.2s; font-weight: 600; border-radius: 12px; }
        .tab-btn.active { background: #ff6b35; color: white; }
        .tab-content { display: none; padding: 24px; background: rgba(255,255,255,0.03); border-radius: 20px; margin-top: 20px; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .color-option { width: 44px; height: 44px; border-radius: 50%; cursor: pointer; transition: all 0.2s; border: 2px solid rgba(255,255,255,0.2); display: inline-flex; align-items: center; justify-content: center; }
        .color-option:hover { transform: scale(1.1); border-color: white; }
        .color-option.selected { border: 2px solid white; box-shadow: 0 0 0 2px #ff6b35; transform: scale(1.05); }
        
        .size-option { padding: 10px 20px; background: rgba(255,255,255,0.05); border-radius: 12px; cursor: pointer; transition: all 0.2s; text-align: center; font-weight: 600; }
        .size-option:hover { background: rgba(255,107,53,0.3); }
        .size-option.selected { background: #ff6b35; color: white; }
        
        .size-chart-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 1100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); cursor: pointer; }
        .size-chart-modal img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 16px; }
        
        .cart-badge { position: absolute; top: -5px; right: -5px; background: #ff6b35; color: white; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ff6b35; padding: 12px 24px; border-radius: 40px; z-index: 1100; animation: fadeInUp 0.3s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .loading-spinner { border: 3px solid rgba(255,107,53,0.3); border-top: 3px solid #ff6b35; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .star-rating { display: flex; gap: 5px; cursor: pointer; }
        .star { font-size: 24px; color: #4a5568; transition: color 0.2s; }
        .star.active { color: #ffb347; }
        .star:hover { color: #ffb347; }
        
        .review-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        .favorite-btn { transition: all 0.2s; }
        .favorite-btn.active { color: #ef4444; }
        .favorite-btn:not(.active):hover { color: #ef4444; transform: scale(1.1); }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,107,53,0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255,107,53,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,107,53,0); }
        }
        .fixed.bottom-6.right-6 { animation: pulse-ring 2s infinite; }

        /* Select2 темна тема для відділень */
        .select2-container--default .select2-selection--single {
            background-color: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            height: 48px;
            display: flex;
            align-items: center;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: white;
            line-height: 46px;
            padding-left: 16px;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 46px;
            right: 12px;
        }
        .select2-dropdown {
            background-color: #1e293b;
            border: 1px solid rgba(255,107,53,0.3);
            border-radius: 12px;
        }
        .select2-container--default .select2-results__option {
            color: #e2e8f0;
        }
        .select2-container--default .select2-results__option--highlighted[aria-selected] {
            background-color: #ff6b35;
        }
        
        /* Анімація завантаження для кнопки пошуку міста */
        .city-loading {
            position: relative;
        }
        .city-loading .loading-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
        }
        .city-loading.loading .loading-icon {
            display: block;
        }
    </style>
</head>
<body>
    <header class="sticky top-0 z-50 bg-black/60 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <a href="/" class="flex items-center gap-3 cursor-pointer">
                    <div class="text-4xl">🐱</div>
                    <div>

    <main class="max-w-7xl mx-auto px-4 py-8">

        </div>

    <!-- Модалка кошика -->
    <div id="cartModal" class="fixed hidden inset-0 bg-black/95 z-[1000] flex items-center justify-center backdrop-blur-md">
        <div class="bg-slate-900 rounded-3xl max-w-2xl w-full max-h-[80vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black"><i class="fas fa-shopping-cart text-orange-500"></i> Кошик</h2>
                <button onclick="toggleCart()" class="text-gray-400 text-2xl hover:text-white">&times;</button>
            </div>
            <div id="cartItems"></div>
            <div id="cartEmpty" class="text-center py-10 text-gray-400 hidden">🛒 Кошик порожній</div>
            <div id="cartSummary" class="border-t border-white/10 pt-4 hidden">
                <div class="flex justify-between text-xl font-bold mb-4">
                    <span>До сплати:</span>

    <!-- Модалка оформлення замовлення (звичайне поле для міста + select2 для відділень) -->
    <div id="checkoutModal" class="fixed hidden inset-0 bg-black/95 z-[1000] flex items-center justify-center backdrop-blur-md">
        <div class="bg-slate-900 rounded-3xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black">Оформлення замовлення</h2>

            </div>

                <input type="text" id="checkoutName" placeholder="ПІБ *" required class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 mb-3 text-white">

                <!-- Відділення (Select2) -->

                        </label>
                        <label class="flex items-center gap-3 p-3 bg-slate-800 rounded-xl cursor-pointer hover:bg-slate-700">
                            <input type="radio" name="paymentMethod" value="partial" class="w-4 h-4 text-orange-500">
                            <span><i class="fas fa-percent text-yellow-400"></i> Часткова оплата (30% передплата)</span>

                        <label class="flex items-center gap-3 p-3 bg-slate-800 rounded-xl cursor-pointer hover:bg-slate-700">
                            <input type="radio" name="paymentMethod" value="post" class="w-4 h-4 text-orange-500">

                        </label>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-orange-500 py-3 rounded-xl font-bold hover:bg-orange-600 transition">✅ Підтвердити замовлення</button>
            </form>
        </div>
    </div>

    <div id="favoritesModal" class="fixed hidden inset-0 bg-black/95 z-[1000] flex items-center justify-center backdrop-blur-md">
        <div class="bg-slate-900 rounded-3xl max-w-2xl w-full max-h-[80vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black"><i class="fas fa-heart text-red-500"></i> Обрані товари</h2>
                <button onclick="closeFavorites()" class="text-gray-400 text-2xl hover:text-white">&times;</button>
            </div>
            <div id="favoritesList"></div>
        </div>
    </div>

    <div id="ordersModal" class="fixed hidden inset-0 bg-black/95 z-[1000] flex items-center justify-center backdrop-blur-md">
        <div class="bg-slate-900 rounded-3xl max-w-2xl w-full max-h-[80vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-black"><i class="fas fa-box text-orange-500"></i> Мої замовлення</h2>
                <button onclick="closeOrders()" class="text-gray-400 text-2xl hover:text-white">&times;</button>
            </div>
            <div id="ordersList"></div>
        </div>
    </div>

    <div id="authModal" class="fixed hidden inset-0 bg-black/95 z-[1000] flex items-center justify-center backdrop-blur-md">
        <div class="bg-slate-900 rounded-3xl max-w-md w-full p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 id="authTitle" class="text-2xl font-black">Вхід</h3>
                <button onclick="closeAuth()" class="text-gray-400 text-2xl hover:text-white">&times;</button>
            </div>
            <form id="authForm">
                <input type="hidden" id="authMode" value="login">
                <input type="text" id="authUsername" placeholder="Логін" required class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 mb-4 text-white">
                <input type="password" id="authPassword" placeholder="Пароль" required class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 mb-4 text-white">
                <button type="submit" class="w-full bg-orange-500 py-3 rounded-xl font-bold hover:bg-orange-600 transition">Увійти</button>
                <p class="text-center text-sm text-gray-400 mt-4">
                    <span id="authSwitchText">Немає акаунту?</span>
                    <button type="button" onclick="switchAuthMode()" class="text-orange-500 ml-1">Зареєструватись</button>
                </p>
            </form>
        </div>
    </div>

    <a href="https://t.me/ArtSeXm" target="_blank" class="fixed bottom-6 right-6 z-50 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white rounded-full p-4 shadow-2xl transition-all duration-300 hover:scale-110 group flex items-center justify-center">
        <i class="fab fa-telegram-plane text-2xl group-hover:rotate-12 transition-transform duration-300"></i>
        <span class="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-xs group-hover:ml-2 transition-all duration-300 text-sm font-medium">Написати менеджеру</span>
    </a>

    <script>
        let product = null;
        let currentUser = null;
        let cartItems = [];
        let selectedSize = null;
        let selectedColor = null;
        let quantity = 1;
        let colorsList = [];
        let reviews = [];
        let isFavorite = false;
        let userRating = 0;
        let citySearchTimeout = null;
        let currentCityRef = null;

        const productId = {{ product_id }};
        const NOVA_POSHTA_API_KEY = "d00481d682b0f3e592170022f9b8b6b4";
        const NOVA_POSHTA_API_URL = "https://api.novaposhta.ua/v2.0/json/";

        // Пошук міста через API (повертає ref та назву)
        async function searchCityByText(cityName) {
            if (!cityName || cityName.length < 2) return null;
            try {
                const response = await fetch(NOVA_POSHTA_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        apiKey: NOVA_POSHTA_API_KEY,
                        modelName: "Address",
                        calledMethod: "searchSettlements",
                        methodProperties: { CityName: cityName, Limit: 1 }
                    })
                });
                const data = await response.json();
                if (data.success && data.data && data.data[0] && data.data[0].Addresses && data.data[0].Addresses.length > 0) {
                    const city = data.data[0].Addresses[0];
                    return { ref: city.DeliveryCity, name: city.Present };
                }
                return null;
            } catch(e) {
                console.error('Search city error:', e);
                return null;
            }
        }

        async function getWarehouses(cityRef) {
            if (!cityRef) return [];
            try {
                const response = await fetch(NOVA_POSHTA_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        apiKey: NOVA_POSHTA_API_KEY,
                        modelName: "Address",
                        calledMethod: "getWarehouses",
                        methodProperties: { CityRef: cityRef, Limit: 100 }
                    })
                });
                const data = await response.json();
                if (data.success && data.data) {
                    return data.data.map(wh => ({
                        id: wh.Ref,
                        name: `${wh.Description}${wh.ShortAddress ? ' (' + wh.ShortAddress + ')' : ''}`
                    }));
                }
                return [];
            } catch(e) {
                console.error('Error loading warehouses:', e);
                return [];
            }
        }

        async function api(url, options = {}) {
            try {
                const res = await fetch(url, {
                    ...options,
                    headers: { 'Content-Type': 'application/json', ...options.headers }
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || 'Помилка');
                }
                return res.json();
            } catch(e) {
                console.error('API Error:', e);
                throw e;
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            if (isError) toast.style.background = '#ef4444';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function loadUser() {
            try {
                const data = await api('/api/me');
                if (data.user) {
                    currentUser = data.user;
                    document.getElementById('authButtons').classList.add('hidden');
                    document.getElementById('userMenu').classList.remove('hidden');
                    document.getElementById('userName').textContent = currentUser.username;
                    if (currentUser.is_admin) document.getElementById('adminPanelBtn')?.classList.remove('hidden');
                    await checkFavoriteStatus();
                } else {
                    currentUser = null;
                    document.getElementById('authButtons').classList.remove('hidden');
                    document.getElementById('userMenu').classList.add('hidden');
                    document.getElementById('adminPanelBtn')?.classList.add('hidden');
                }
            } catch(e) { console.error(e); }
        }

        async function checkFavoriteStatus() {
            if (!currentUser) return;
            try {
                const favorites = await api('/api/favorites');
                isFavorite = favorites.includes(productId);
                updateFavoriteButton();
            } catch(e) { console.error(e); }
        }

        function updateFavoriteButton() {
            const favBtn = document.getElementById('favoriteBtn');
            if (favBtn) {
                if (isFavorite) { favBtn.classList.add('active'); favBtn.innerHTML = '<i class="fas fa-heart text-2xl"></i>'; }
                else { favBtn.classList.remove('active'); favBtn.innerHTML = '<i class="far fa-heart text-2xl"></i>'; }
            }
        }

        async function toggleFavorite() {
            if (!currentUser) { showToast('Увійдіть в акаунт, щоб додати в обране', true); openAuth('login'); return; }
            try {
                if (isFavorite) { await api(`/api/favorites/${productId}`, { method: 'DELETE' }); isFavorite = false; showToast('❤️ Видалено з обраного'); }
                else { await api(`/api/favorites/${productId}`, { method: 'POST' }); isFavorite = true; showToast('💖 Додано в обране'); }
                updateFavoriteButton();
            } catch(e) { showToast('❌ ' + e.message, true); }
        }

        async function loadColors() { try { colorsList = await api('/api/colors'); } catch(e) { console.error(e); } }
        function getColorInfo(colorName) { const color = colorsList.find(c => c.name === colorName); return color || { name: colorName, code: '#808080', icon: '🎨' }; }

        async function loadProduct() {
            try {
                product = await api(`/api/products/${productId}`);
                await loadColors();
                await loadReviews();
                renderProduct();
            } catch(e) { document.getElementById('productContent').innerHTML = `<div class="text-center py-20"><i class="fas fa-exclamation-triangle text-6xl text-red-500 mb-4"></i><p class="text-xl">Товар не знайдено</p><a href="/" class="inline-block mt-6 px-6 py-3 bg-orange-500 rounded-xl">На головну</a></div>`; }
        }

        async function loadReviews() { try { reviews = await api(`/api/products/${productId}/reviews`); } catch(e) { console.error(e); } }

        async function submitReview() {
            if (!currentUser) { showToast('Увійдіть в акаунт, щоб залишити відгук', true); openAuth('login'); return; }
            if (userRating === 0) { showToast('Оберіть оцінку', true); return; }
            const comment = document.getElementById('reviewComment').value;
            try {
                await api(`/api/products/${productId}/reviews`, { method: 'POST', body: JSON.stringify({ rating: userRating, comment }) });
                showToast('✅ Відгук додано');
                document.getElementById('reviewComment').value = '';
                userRating = 0;
                renderStarRating();
                await loadReviews();
                await loadProduct();
            } catch(e) { showToast('❌ ' + e.message, true); }
        }

        function renderStarRating() {
            const container = document.getElementById('starRating');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('i');
                star.className = `fas fa-star star ${i <= userRating ? 'active' : ''}`;
                star.style.cursor = 'pointer';
                star.onclick = () => { userRating = i; renderStarRating(); };
                container.appendChild(star);
            }
        }

        function openSizeChartModal() { if (product?.size_chart_url) { const modal = document.createElement('div'); modal.className = 'size-chart-modal'; modal.onclick = () => modal.remove(); modal.innerHTML = `<img src="${product.size_chart_url}" alt="Розмірна сітка" onclick="event.stopPropagation()">`; document.body.appendChild(modal); } }
        function scrollThumbnails(direction) { const container = document.querySelector('.thumbnail-container'); if (!container) return; container.scrollBy({ left: direction === 'left' ? -140 : 140, behavior: 'smooth' }); }

        function renderProduct() {
            const container = document.getElementById('productContent');
            const photos = product.photos || [];
            const mainPhoto = photos[0] || 'https://placehold.co/800x800?text=KISIK';
            const productColors = product.colors || [];
            const hasSizeChart = product.size_chart_url && product.size_chart_url.trim() !== '';
            const ratingDisplay = product.rating_avg > 0 ? product.rating_avg.toFixed(1) : '0';
            
            container.innerHTML = `
                <div class="grid md:grid-cols-2 gap-8 mb-12">
                    <div>
                        <div class="gallery-container mb-4"><img src="${mainPhoto}" alt="${product.name}" class="main-image" id="mainImage"></div>
                        ${photos.length > 1 ? `<div class="thumb-wrapper"><button class="thumb-nav left" onclick="scrollThumbnails('left')"><i class="fas fa-chevron-left"></i></button><div class="thumbnail-container">${photos.map((photo, idx) => `<img src="${photo}" class="thumbnail ${idx === 0 ? 'active' : ''}" onclick="changeImage(${idx})">`).join('')}</div><button class="thumb-nav right" onclick="scrollThumbnails('right')"><i class="fas fa-chevron-right"></i></button></div>` : ''}
                        ${hasSizeChart ? `<div class="mt-4 text-center"><button onclick="openSizeChartModal()" class="text-sm bg-white/10 px-4 py-2 rounded-full hover:bg-white/20 transition"><i class="fas fa-ruler-combined text-orange-400"></i> Дивитись розмірну сітку</button></div>` : ''}
                    </div>
                    <div>
                        <div class="mb-4"><div class="flex items-center justify-between mb-2"><div class="flex items-center gap-2"><span class="text-sm text-orange-400">${product.category}</span>${product.brand ? `<span class="text-sm text-gray-500">| ${product.brand}</span>` : ''}</div><button id="favoriteBtn" onclick="toggleFavorite()" class="favorite-btn px-3 py-2 rounded-full hover:bg-white/10 transition"><i class="${isFavorite ? 'fas' : 'far'} fa-heart text-2xl"></i></button></div><h1 class="text-3xl md:text-4xl font-black mb-3">${escapeHtml(product.name)}</h1><div class="flex items-center gap-2 mb-4"><div class="flex text-yellow-400">${renderStars(product.rating_avg)}</div><span class="text-sm text-gray-400">${ratingDisplay} (${product.rating_count} відгуків)</span></div><p class="text-4xl font-bold text-orange-500 mb-4">${product.price} ₴</p><p class="text-gray-400 mb-6">${product.description || 'Стильний та якісний товар від KISIK MARKET.'}</p></div>
                        ${productColors.length > 0 ? `<div class="mb-6"><p class="font-bold mb-3">Колір: <span id="selectedColorText" class="text-orange-400">${productColors[0]}</span></p><div class="flex gap-3 flex-wrap" id="colorOptions">${productColors.map(color => { const colorInfo = getColorInfo(color); const isBlack = color === 'Чорний' || color.toLowerCase() === 'black'; return `<div class="color-option ${color === productColors[0] ? 'selected' : ''}" style="background: ${colorInfo.code}; ${isBlack ? 'border: 2px solid white;' : ''}" title="${color}" onclick="selectColor('${color}')"></div>`; }).join('')}</div></div>` : ''}
                        <div class="mb-6"><p class="font-bold mb-3">Розмір: <span id="selectedSizeText" class="text-orange-400">Оберіть розмір</span></p><div class="flex gap-3 flex-wrap" id="sizeOptions">${product.sizes.map(size => `<div class="size-option" onclick="selectSize('${size}')">${size}</div>`).join('')}</div></div>
                        <div class="flex gap-4"><button onclick="addToCart()" class="flex-1 bg-orange-500 py-4 rounded-xl font-bold hover:bg-orange-600 transition text-lg"><i class="fas fa-shopping-cart"></i> Додати в кошик</button></div>
                    </div>
                </div>
                <div class="mt-12"><div class="flex gap-3 flex-wrap border-b border-white/10 pb-3"><button class="tab-btn active" onclick="switchTab('description')">📝 Опис</button><button class="tab-btn" onclick="switchTab('specs')">⚙️ Характеристики</button><button class="tab-btn" onclick="switchTab('reviews')">💬 Відгуки (${product.rating_count})</button><button class="tab-btn" onclick="switchTab('delivery')">🚚 Доставка та оплата</button></div>
                <div id="tab-description" class="tab-content active"><p class="text-gray-300 leading-relaxed">${product.description || 'Стильний та якісний товар від KISIK MARKET.'}</p></div>
                <div id="tab-specs" class="tab-content"><div class="space-y-3"><div class="flex py-2 border-b border-white/10"><span class="w-32 text-gray-400">Бренд:</span><span class="font-medium">${product.brand || 'KISIK'}</span></div><div class="flex py-2 border-b border-white/10"><span class="w-32 text-gray-400">Категорія:</span><span class="font-medium">${product.category}</span></div><div class="flex py-2 border-b border-white/10"><span class="w-32 text-gray-400">Матеріал:</span><span class="font-medium">${product.material || '100% бавовна'}</span></div><div class="flex py-2 border-b border-white/10"><span class="w-32 text-gray-400">Країна:</span><span class="font-medium">${product.country || 'Україна'}</span></div><div class="flex py-2 border-b border-white/10"><span class="w-32 text-gray-400">Розміри:</span><span class="font-medium">${product.sizes.join(', ')}</span></div>${productColors.length ? `<div class="flex py-2 border-b border-white/10"><span class="w-32 text-gray-400">Кольори:</span><span class="font-medium">${productColors.join(', ')}</span></div>` : ''}</div></div>
                <div id="tab-reviews" class="tab-content"><div class="mb-6"><h3 class="text-xl font-bold mb-4">Залишити відгук</h3><div class="mb-3"><p class="text-sm mb-2">Ваша оцінка:</p><div id="starRating" class="star-rating"></div></div><textarea id="reviewComment" rows="3" placeholder="Ваш коментар..." class="w-full bg-slate-800 border border-white/10 rounded-xl p-3 text-white resize-none mb-3"></textarea><button onclick="submitReview()" class="bg-orange-500 px-6 py-2 rounded-xl font-bold hover:bg-orange-600 transition">Додати відгук</button></div><div class="border-t border-white/10 pt-4"><h3 class="text-xl font-bold mb-4">Відгуки покупців</h3><div id="reviewsList">${reviews.length === 0 ? '<p class="text-gray-400 text-center py-8">Ще немає відгуків. Будьте першим!</p>' : reviews.map(r => `<div class="review-card"><div class="flex items-center justify-between mb-2"><span class="font-bold">${escapeHtml(r.user_name)}</span><div class="flex text-yellow-400">${renderStars(r.rating)}</div></div><p class="text-gray-300 text-sm">${escapeHtml(r.comment || '')}</p><p class="text-gray-500 text-xs mt-2">${new Date(r.created_at).toLocaleDateString()}</p></div>`).join('')}</div></div></div>
                <div id="tab-delivery" class="tab-content"><div class="space-y-4"><div class="flex gap-4 p-4 bg-white/5 rounded-xl"><i class="fas fa-truck text-3xl text-orange-400"></i><div><h4 class="font-bold mb-2">Доставка Новою Поштою</h4><p class="text-gray-400 text-sm">Доставка по всій Україні.</p></div></div><div class="flex gap-4 p-4 bg-white/5 rounded-xl"><i class="fas fa-credit-card text-3xl text-orange-400"></i><div><h4 class="font-bold mb-2">Способи оплати</h4><p class="text-gray-400 text-sm">Повна оплата • Часткова (30%) • Оплата на пошті</p></div></div><div class="flex gap-4 p-4 bg-white/5 rounded-xl"><i class="fas fa-undo-alt text-3xl text-orange-400"></i><div><h4 class="font-bold mb-2">Повернення</h4><p class="text-gray-400 text-sm">Протягом 14 днів.</p></div></div></div></div>
            `;
            if (productColors.length > 0) { selectedColor = productColors[0]; document.getElementById('selectedColorText').textContent = selectedColor; }
            renderStarRating();
            updateFavoriteButton();
        }

        function renderStars(rating) { const fullStars = Math.floor(rating); const hasHalf = rating % 1 >= 0.5; let stars = ''; for (let i = 0; i < fullStars; i++) stars += '<i class="fas fa-star"></i>'; if (hasHalf) stars += '<i class="fas fa-star-half-alt"></i>'; for (let i = stars.length; i < 5; i++) stars += '<i class="far fa-star"></i>'; return stars; }
        function changeImage(index) { const photos = product.photos; const mainImage = document.getElementById('mainImage'); if (mainImage && photos[index]) { mainImage.src = photos[index]; document.querySelectorAll('.thumbnail').forEach((thumb, i) => { if (i === index) thumb.classList.add('active'); else thumb.classList.remove('active'); }); } }
        function selectSize(size) { selectedSize = size; document.getElementById('selectedSizeText').textContent = size; document.querySelectorAll('.size-option').forEach(el => { if (el.textContent === size) el.classList.add('selected'); else el.classList.remove('selected'); }); }
        function selectColor(color) { selectedColor = color; document.getElementById('selectedColorText').textContent = color; document.querySelectorAll('.color-option').forEach(el => { if (el.title === color) el.classList.add('selected'); else el.classList.remove('selected'); }); }
        function switchTab(tab) { document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active')); const btns = document.querySelectorAll('.tab-btn'); const contents = ['description', 'specs', 'reviews', 'delivery']; const index = contents.indexOf(tab); if (index >= 0 && btns[index]) btns[index].classList.add('active'); document.getElementById(`tab-${tab}`).classList.add('active'); }

        async function addToCart() { if (!selectedSize) { showToast('❌ Будь ласка, оберіть розмір', true); return; } try { await api('/api/cart', { method: 'POST', body: JSON.stringify({ product_id: product.id, size: selectedSize, color: selectedColor, quantity }) }); await loadCart(); showToast('✅ Товар додано в кошик'); } catch(e) { showToast('❌ ' + e.message, true); } }
        async function loadCart() { try { cartItems = await api('/api/cart'); updateCartUI(); } catch(e) { console.error(e); } }
        function updateCartUI() { const count = cartItems.reduce((s, i) => s + i.quantity, 0); const badge = document.getElementById('cartCount'); if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); } else { badge.classList.add('hidden'); } }
        function toggleCart() { renderCart(); document.getElementById('cartModal').classList.toggle('hidden'); }
        async function renderCart() { const container = document.getElementById('cartItems'); const empty = document.getElementById('cartEmpty'); const summary = document.getElementById('cartSummary'); if (!cartItems.length) { container.innerHTML = ''; empty.classList.remove('hidden'); summary.classList.add('hidden'); return; } empty.classList.add('hidden'); summary.classList.remove('hidden'); let total = 0; container.innerHTML = cartItems.map(item => { total += item.price * item.quantity; return `<div class="flex gap-4 p-4 bg-white/5 rounded-2xl mb-3"><img src="${item.photo || 'https://placehold.co/80'}" class="w-20 h-20 rounded-xl object-cover"><div class="flex-1"><h4 class="font-bold">${escapeHtml(item.name)}</h4><p class="text-sm">Розмір: ${item.size}</p>${item.color ? `<p class="text-sm">Колір: ${item.color}</p>` : ''}<p class="text-orange-400">${item.price} грн</p><div class="flex items-center gap-2 mt-2"><button onclick="updateQty(${item.id}, ${item.quantity - 1})" class="w-8 h-8 bg-white/10 rounded-full">-</button><span>${item.quantity}</span><button onclick="updateQty(${item.id}, ${item.quantity + 1})" class="w-8 h-8 bg-white/10 rounded-full">+</button><button onclick="removeItem(${item.id})" class="ml-auto text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button></div></div></div>`; }).join(''); document.getElementById('cartTotal').textContent = total + ' грн'; }
        async function updateQty(id, qty) { if (qty <= 0) { await removeItem(id); return; } await api('/api/cart/update', { method: 'POST', body: JSON.stringify({ cart_item_id: id, quantity: qty }) }); await loadCart(); renderCart(); }
        async function removeItem(id) { await api(`/api/cart/${id}`, { method: 'DELETE' }); await loadCart(); renderCart(); }

        function openCheckout() { if (!cartItems.length) { showToast('Кошик порожній', true); return; } toggleCart(); document.getElementById('checkoutModal').classList.remove('hidden'); initWarehouseSelect(); }
        function closeCheckout() { document.getElementById('checkoutModal').classList.add('hidden'); $('#checkoutWarehouse').val('').prop('disabled', true); $('#checkoutWarehouse').html('<option value="">Спочатку введіть місто</option>'); document.getElementById('checkoutCity').value = ''; currentCityRef = null; }

        function initWarehouseSelect() {
            $('#checkoutWarehouse').select2({
                placeholder: "Оберіть відділення",
                dropdownParent: $('#checkoutModal'),
                width: '100%'
            });
            
            const cityInput = document.getElementById('checkoutCity');
            const wrapper = document.getElementById('cityInputWrapper');
            
            cityInput.addEventListener('input', function() {
                if (citySearchTimeout) clearTimeout(citySearchTimeout);
                const cityName = this.value.trim();
                
                if (cityName.length < 2) {
                    $('#checkoutWarehouse').prop('disabled', true).html('<option value="">Спочатку введіть місто</option>');
                    currentCityRef = null;
                    return;
                }
                
                wrapper.classList.add('loading');
                
                citySearchTimeout = setTimeout(async () => {
                    const cityData = await searchCityByText(cityName);
                    wrapper.classList.remove('loading');
                    
                    if (cityData) {
                        currentCityRef = cityData.ref;
                        const warehouses = await getWarehouses(currentCityRef);
                        const warehouseSelect = $('#checkoutWarehouse');
                        
                        if (warehouses.length === 0) {
                            warehouseSelect.prop('disabled', true).html('<option value="">Немає відділень у цьому місті</option>');
                            showToast('❌ У цьому місті не знайдено відділень Нової Пошти', true);
                        } else {
                            warehouseSelect.prop('disabled', false);
                            warehouseSelect.html('<option value="">Оберіть відділення</option>' + warehouses.map(w => `<option value="${w.name}">${w.name}</option>`).join(''));
                            showToast(`✅ Знайдено ${warehouses.length} відділень у місті ${cityData.name}`);
                        }
                    } else if (cityName.length >= 2) {
                        currentCityRef = null;
                        $('#checkoutWarehouse').prop('disabled', true).html('<option value="">Місто не знайдено, спробуйте ще раз</option>');
                        showToast('❌ Місто не знайдено, перевірте назву', true);
                    }
                }, 800);
            });
        }

        document.getElementById('checkoutForm').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('checkoutName').value.trim();
            const phone = document.getElementById('checkoutPhone').value.trim();
            const email = document.getElementById('checkoutEmail').value.trim();
            const city = document.getElementById('checkoutCity').value.trim();
            const warehouse_address = $('#checkoutWarehouse').val();
            const payment_method = document.querySelector('input[name="paymentMethod"]:checked').value;
            
            if (!name || !phone || !city || !warehouse_address || warehouse_address === 'Спочатку введіть місто' || warehouse_address === 'Місто не знайдено, спробуйте ще раз') { 
                showToast('❌ Заповніть всі поля коректно', true); 
                return; 
            }
            
            if (!currentCityRef && city.length >= 2) {
                showToast('❌ Будь ласка, зачекайте поки місто перевіриться', true);
                return;
            }
            
            const btn = document.querySelector('#checkoutForm button[type="submit"]');
            btn.disabled = true; btn.textContent = '⏳ Відправка...';
            try {
                const data = await api('/api/checkout', { method: 'POST', body: JSON.stringify({ name, phone, email, city, warehouse_address, payment_method }) });
                showToast(`✅ Замовлення №${data.order_number} створено! Дякуємо!`);
                closeCheckout();
                await loadCart(); renderCart();
                document.getElementById('checkoutName').value = '';
                document.getElementById('checkoutPhone').value = '';
                document.getElementById('checkoutEmail').value = '';
                document.getElementById('checkoutCity').value = '';
            } catch(e) { showToast('❌ ' + e.message, true); }
            finally { btn.disabled = false; btn.textContent = '✅ Підтвердити замовлення'; }
        };

        async function showFavorites() { if (!currentUser) { showToast('Увійдіть в акаунт', true); return; } try { const favoriteIds = await api('/api/favorites'); if (!favoriteIds.length) document.getElementById('favoritesList').innerHTML = '<div class="text-center py-10 text-gray-400">❤️ Немає обраних товарів</div>'; else { const productsData = await Promise.all(favoriteIds.map(id => api(`/api/products/${id}`))); document.getElementById('favoritesList').innerHTML = productsData.map(p => `<div class="flex gap-4 p-4 bg-white/5 rounded-2xl mb-3 cursor-pointer" onclick="location.href='/product/${p.id}'"><img src="${p.photos[0] || 'https://placehold.co/80'}" class="w-20 h-20 rounded-xl object-cover"><div class="flex-1"><h4 class="font-bold">${escapeHtml(p.name)}</h4><p class="text-orange-400 font-bold">${p.price} грн</p><div class="flex text-yellow-400 text-sm">${renderStars(p.rating_avg)}</div></div></div>`).join(''); } document.getElementById('favoritesModal').classList.remove('hidden'); } catch(e) { showToast('❌ ' + e.message, true); } }
        async function showOrders() { if (!currentUser) { showToast('Увійдіть в акаунт', true); return; } try { const orders = await api('/api/orders'); if (!orders.length) document.getElementById('ordersList').innerHTML = '<div class="text-center py-10 text-gray-400">📦 У вас ще немає замовлень</div>'; else { document.getElementById('ordersList').innerHTML = orders.map(o => `<div class="p-4 bg-white/5 rounded-2xl mb-3"><div class="flex justify-between"><span class="font-bold">№${o.order_number}</span><span class="text-orange-400">${o.total_price} грн</span></div><p class="text-sm text-gray-400">${new Date(o.created_at).toLocaleDateString()}</p><span class="inline-block mt-2 px-2 py-1 bg-orange-500/20 rounded-lg text-xs">${o.status === 'new' ? 'Нове' : o.status === 'completed' ? 'Виконано' : o.status}</span></div>`).join(''); } document.getElementById('ordersModal').classList.remove('hidden'); } catch(e) { showToast('❌ ' + e.message, true); } }
        function closeFavorites() { document.getElementById('favoritesModal').classList.add('hidden'); }
        function closeOrders() { document.getElementById('ordersModal').classList.add('hidden'); }
        function openAuth(mode) { document.getElementById('authMode').value = mode; document.getElementById('authTitle').textContent = mode === 'login' ? 'Вхід' : 'Реєстрація'; document.getElementById('authModal').classList.remove('hidden'); }
        function closeAuth() { document.getElementById('authModal').classList.add('hidden'); }
        function switchAuthMode() { openAuth(document.getElementById('authMode').value === 'login' ? 'register' : 'login'); }
        document.getElementById('authForm').onsubmit = async (e) => { e.preventDefault(); const mode = document.getElementById('authMode').value; const username = document.getElementById('authUsername').value; const password = document.getElementById('authPassword').value; try { await api(mode === 'login' ? '/api/login' : '/api/register', { method: 'POST', body: JSON.stringify({ username, password }) }); showToast(mode === 'login' ? '✅ Вхід виконано' : '✅ Реєстрація успішна'); closeAuth(); await loadUser(); await loadCart(); await checkFavoriteStatus(); } catch(e) { showToast('❌ ' + e.message, true); } };
        async function logout() { await api('/api/logout', { method: 'POST' }); window.location.href = '/'; }
        function toggleUserMenu() { document.getElementById('userDropdown').classList.toggle('hidden'); }
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        document.addEventListener('click', (e) => { const menu = document.getElementById('userMenu'); if (menu && !menu.contains(e.target)) document.getElementById('userDropdown')?.classList.add('hidden'); });
        async function init() { await loadUser(); await loadProduct(); await loadCart(); }
        init();
    </script>
</body>
</html>
